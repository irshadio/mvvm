name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# Mirrors the local quality gate (tool/gate.dart) plus a formatting check, so a
# green PR is guaranteed to satisfy every gate the commit hook enforces.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # envied generates AppConfig from .env; ensure one exists for codegen.
      - name: Ensure .env
        run: '[ -f .env ] || cp .env.example .env'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Import boundaries
        run: dart run tool/check_boundaries.dart

      - name: LOC limit
        run: dart run tool/check_loc.dart

      - name: Test
        run: flutter test
