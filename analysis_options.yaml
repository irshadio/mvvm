# Static analysis for the MVVM architecture.
#
# Lint baseline: very_good_analysis (strict). Architectural import boundaries
# are enforced separately by `tool/check_boundaries.dart` (analyzer plugins like
# custom_lint/import_rules can't co-exist with Riverpod 3.2 + Freezed 3 today).
#
# Run:  flutter analyze                      (must be clean before every commit)
#       dart run tool/check_boundaries.dart  (feature/layer import rules)

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  errors:
    # Freezed / json_serializable place annotations on factory params; expected.
    invalid_annotation_target: ignore
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"

linter:
  rules:
    # This is an application, not a published package — documenting every public
    # member is excessive. Public APIs are still documented by convention where
    # it helps agents.
    public_member_api_docs: false
