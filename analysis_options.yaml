# Static analysis for the MVVM architecture.
#
# We deliberately rely on the STABLE analyzer layer (built-in lints + strict
# language modes) rather than analyzer plugins (custom_lint / riverpod_lint /
# import_rules). Those plugins are version-churny and currently cannot co-exist
# with Riverpod 3.2 + Freezed 3 + the current analyzer. Architectural import
# boundaries are enforced separately by `tool/check_boundaries.dart`, which is
# transparent, conflict-free, and easy for agents to read and extend.
#
# Run:  flutter analyze                          (must be clean before every commit)
#       dart run tool/check_boundaries.dart      (feature/layer import rules)

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # High-value strict modes: catch implicit casts / dynamic / raw generics.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Freezed / json_serializable place annotations on factory params; expected.
    invalid_annotation_target: ignore
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"

linter:
  rules:
    # Consistency — agents copy templates verbatim, keep one house style.
    - prefer_single_quotes
    - directives_ordering
    - use_super_parameters
    - sort_child_properties_last
    # Immutability / const-correctness (Freezed models + const widgets).
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    # Safety / correctness.
    - always_declare_return_types
    - avoid_dynamic_calls
    - unawaited_futures
    - only_throw_errors
    - throw_in_finally
