# Static analysis for the MVVM architecture.
#
# Lint baseline: very_good_analysis (strict). Architectural import boundaries
# are enforced separately by `tool/check_boundaries.dart` (analyzer plugins like
# custom_lint/import_rules can't co-exist with Riverpod 3.2 + Freezed 3 today).
#
# Run:  flutter analyze                      (must be clean before every commit)
#       dart run tool/check_boundaries.dart  (feature/layer import rules)

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  # Strict type checking. very_good_analysis already enables these, but we state
  # them explicitly: this file is the authoritative rule set agents read, and an
  # explicit block keeps the guarantee if the baseline is ever bumped or
  # swapped. `flutter analyze` is fatal on the resulting diagnostics.
  language:
    strict-casts: true # no implicit dynamic -> T casts
    strict-inference: true # nothing silently inferred as dynamic
    strict-raw-types: true # no raw generics (List, not List<T>)
  errors:
    # Freezed / json_serializable place annotations on factory params; expected.
    invalid_annotation_target: ignore
    todo: ignore
    # Promote the lints that map 1:1 to CLAUDE.md §12 "Do NOT" bans from info to
    # hard errors, so they fail red (and fail plain `dart analyze` and IDEs),
    # not merely as advisory infos.
    always_use_package_imports: error # §2/§12: never relative imports
    avoid_print: error # §8: use AppLogger, never print
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "build/**"

linter:
  rules:
    # This is an application, not a published package — documenting every public
    # member is excessive. Public APIs are still documented by convention where
    # it helps agents.
    public_member_api_docs: false
